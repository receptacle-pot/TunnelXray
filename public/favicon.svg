<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64">
  <style>
    polygon, circle, line {
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: miter;
    }
    @media (prefers-color-scheme: light) {
      polygon, circle, line {
        stroke: #0a0a0c;
      }
    }
  </style>
  <!-- Equilateral Triangle (Invisibility Cloak) -->
  <polygon points="12,3.68 22,21 2,21" />
  <!-- Inscribed Circle (Resurrection Stone) -->
  <circle cx="12" cy="15.23" r="5.77" />
  <!-- Vertical Altitude (Elder Wand) -->
  <line x1="12" y1="3.68" x2="12" y2="21" stroke-linecap="butt" />
</svg>